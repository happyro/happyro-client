<!DOCTYPE html>    
<html>    
    <head>    
        <meta charset="UTF-8">    
        <meta name="happyro-build-id" content="muckg8k0">
        <title>HappyRO</title>    
        <link rel="icon" type="image/x-icon" href="./favicon.ico?v=ro-icon-1">    
        <link rel="apple-touch-icon" href="./icon.png">    
        <style>    
            html, body {    
                margin: 0; padding: 0; border: 0;    
                height: 100%; width: 100%; overflow: hidden;    
            }    
            #ro-preloader {    
                position: fixed;    
                top: 0; left: 0;    
                width: 100%; height: 100%;    
                z-index: 99999;    
                background: rgba(6, 8, 16, 0.97);    
                display: flex;    
                align-items: center;    
                justify-content: center;    
                flex-direction: column;    
                gap: 18px;    
            }    
            .pre-spinner {    
                width: 48px; height: 48px;    
                border: 4px solid rgba(232, 184, 75, 0.2);    
                border-top-color: #e8b84b;    
                border-radius: 50%;    
                animation: ro-spin 0.8s linear infinite;    
            }    
            @keyframes ro-spin {    
                to { transform: rotate(360deg); }    
            }    
            .pre-text {    
                font-family: 'Cinzel', serif;    
                font-size: 16px;    
                letter-spacing: 3px;    
                text-transform: uppercase;    
                color: #e8b84b;    
                display: flex;    
                gap: 2px;    
            }    
            .pre-text span {    
                animation: ro-wave 1.2s ease-in-out infinite;    
                animation-delay: calc(var(--i) * 0.08s);    
            }    
            @keyframes ro-wave {    
                0%, 100% { opacity: 0.4; transform: translateY(0); }    
                50% { opacity: 1; transform: translateY(-4px); }    
            }    
        </style>    
    </head>    
    <body>    
        <div id="ro-preloader">    
            <div class="pre-spinner"></div>    
            <p class="pre-text">    
                <span style="--i:0">L</span><span style="--i:1">o</span><span style="--i:2">a</span><span style="--i:3">d</span><span style="--i:4">i</span><span style="--i:5">n</span><span style="--i:6">g</span><span style="--i:7">.</span><span style="--i:8">.</span><span style="--i:9">.</span>    
            </p>    
        </div>    
    
        <script>
            var startApplication = (function createStartupLoader({ buildId, importModule = url => import(url) }) {
	let started = false;
	function fail(message) {
		window.happyroDiagnostic?.('startup.failed', { message });
		window.happyroDiagnosticFlush?.();
		let panel = document.getElementById('ro-preloader');
		if (!panel) {
			panel = document.createElement('div');
			panel.id = 'ro-preloader';
			document.body.appendChild(panel);
		}
		panel.replaceChildren();
		// An import can fail after the game has already installed touch handlers.
		for (const type of ['touchstart', 'touchmove', 'touchend']) {
			panel.addEventListener(type, event => event.stopPropagation(), { passive: true });
		}
		const text = document.createElement('p');
		text.textContent = message;
		text.style.cssText = 'color:white;font:16px sans-serif;padding:20px;text-align:center';
		text.setAttribute('role', 'alert');
		const retry = document.createElement('button');
		retry.textContent = '重新加载';
		retry.style.cssText = 'font-size:16px;padding:12px 24px';
		retry.onclick = () => window.location.reload();
		panel.append(text, retry);
	}
	function loadScript(file, globalName) {
		return new Promise((resolve, reject) => {
			const script = document.createElement('script');
			let timer;
			const finish = error => {
				clearTimeout(timer);
				script.onload = script.onerror = null;
				if (error) {
					script.remove();
					reject(error);
				} else resolve();
			};
			script.onload = () => {
				const value = window[globalName];
				const valid = value !== null && (typeof value === 'object' || typeof value === 'function');
				finish(valid ? null : new Error(file + ' 未提供有效配置，请重新加载。'));
			};
			script.onerror = () => finish(new Error(file + ' 加载失败，请检查连接后重新加载。'));
			timer = setTimeout(() => finish(new Error(file + ' 加载超时，请重新加载。')), 15000);
			script.src = file + '?v=' + encodeURIComponent(buildId);
			document.head.appendChild(script);
		});
	}
	function merge(target, source) {
		for (const key of Object.keys(source)) {
			if (key === '__proto__' || key === 'constructor' || key === 'prototype') continue;
			const value = source[key];
			if (value && typeof value === 'object' && !Array.isArray(value)) {
				target[key] = merge(target[key] || {}, value);
			} else target[key] = value;
		}
		return target;
	}
	return async function load(scriptFile, extraConfig) {
		if (started) return false;
		started = true;
		try {
			// GRF previews embed other viewers through ROBrowser; the game does not.
			if (scriptFile === 'GrfViewer.js') await loadScript('api.js', 'ROBrowser');
			// Runtime overrides must execute before HappyRO reads them.
			for (const [file, globalName] of [
				['Config.js', 'ROConfigBase'],
				['Config.runtime.js', 'ROConfigRuntime'],
				['Config.happyro.js', 'ROConfigHappyRO']
			]) await loadScript(file, globalName);
			const config = merge(merge({}, window.ROConfigBase), window.ROConfigHappyRO);
			if (window.ROConfigLocal) merge(config, window.ROConfigLocal);
			if (extraConfig) merge(config, extraConfig);
			window.happyroDiagnosticConfig?.('launcher.merged', config);
			if (typeof config.remoteClient !== 'string' || !config.remoteClient.trim()) {
				throw new Error('资源服务器配置缺失，请重新加载。');
			}
			if (scriptFile === 'Online.js' && (!Array.isArray(config.servers) || !config.servers.length)) {
				throw new Error('游戏服务器配置缺失，请重新加载。');
			}
			window.ROConfig = config;
		} catch (error) {
			fail(error.message);
			return false;
		}
		window.happyroDiagnostic?.('startup.import', { target: scriptFile, message: buildId });
		try {
			await importModule('./' + scriptFile + '?v=' + encodeURIComponent(buildId));
			window.happyroDiagnostic?.('startup.import.complete', { target: scriptFile, success: true });
			document.getElementById('ro-preloader')?.remove();
			return true;
		} catch (error) {
			window.happyroDiagnostic?.('startup.import.complete', { target: scriptFile, success: false, message: error?.name || 'unknown' });
			fail('游戏程序加载失败，请检查连接后重新加载。');
			return false;
		}
	};
})({ buildId: 'muckg8k0' });
    
            var APP_SCRIPTS = {    
                ONLINE: 'Online.js',    
                MAPVIEWER: 'MapViewer.js',    
                GRFVIEWER: 'GrfViewer.js',    
                MODELVIEWER: 'ModelViewer.js',    
                STRVIEWER: 'StrViewer.js',    
                GRANNYMODELVIEWER: 'GrannyModelViewer.js',    
                EFFECTVIEWER: 'EffectViewer.js'    
            };    
            var APP_IDS = { 1: 'ONLINE', 2: 'MAPVIEWER', 3: 'GRFVIEWER', 4: 'MODELVIEWER', 5: 'STRVIEWER', 6: 'GRANNYMODELVIEWER', 7: 'EFFECTVIEWER' };    
    
            function loadApp(appName, extraConfig) {    
                var scriptFile = APP_SCRIPTS[appName] || 'Online.js';    
                return startApplication(scriptFile, extraConfig);
            }    
    
            window.addEventListener('load', function() {    
                var params = new URLSearchParams(window.location.search);    
                var appName = params.get('app');    
                if (appName) {    
                    loadApp(appName, null);    
                } else {    
                    window.addEventListener('message', function onMsg(event) {    
                        if (!event.data || typeof event.data !== 'object') return;    
                        if (!event.data.application) return;    
                        window.removeEventListener('message', onMsg, false);    
                        var name = APP_IDS[event.data.application] || 'ONLINE';    
                        loadApp(name, event.data).then(function(ready) {
                            if (ready && event.source) { event.source.postMessage('ready', event.origin); }
                        });
                    }, false);    
                }    
            });    
        </script>    
    </body>    
</html>
