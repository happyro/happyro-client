<!DOCTYPE html>    
<html>    
    <head>    
        <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>    
        <meta charset="UTF-8">    
        <meta name="happyro-build-id" content="mueyap45">
        <title>HappyRO</title>    
        <link rel="icon" type="image/png" href="./favicon.png?v=happyro-icon-2">    
    
        <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">    
        <meta name="HandheldFriendly" content="true">    
    
        <meta name="apple-mobile-web-app-capable" content="yes">    
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">    
        <meta name="apple-mobile-web-app-title" content="HappyRO">    
        <meta name="mobile-web-app-capable" content="yes">    
    
        <meta name="description" content="HappyRO">    
        <meta name="keywords" content="HappyRO">    
        <meta name="author" content="HappyRO">    
        <meta name="robots" content="index">    
    
        <meta name="theme-color" content="#ff8cb5">    
    
        <meta property="og:title" content="HappyRO">    
        <meta property="og:description" content="HappyRO">    
        <meta property="og:type" content="website">    
        <meta property="og:locale" content="en_US">    
    
        <link rel="apple-touch-icon" href="./icon.png">    
        <link rel="manifest" href="./manifest.webmanifest">    
  
        <style>    
            html, body {    
                margin: 0; padding: 0; border: 0;    
                height: 100%; width: 100%; overflow: hidden;    
            }    
            #ro-preloader {    
                position: fixed;    
                top: 0; left: 0;    
                width: 100%; height: 100%;    
                z-index: 99999;    
                background: rgba(6, 8, 16, 0.97);    
                display: flex;    
                align-items: center;    
                justify-content: center;    
                flex-direction: column;    
            }    
            #ro-preloader .pre-spinner {    
                width: 48px; height: 48px;    
                margin: 0 auto 16px;    
                border: 4px solid rgba(232, 184, 75, 0.2);    
                border-top-color: #e8b84b;    
                border-radius: 50%;    
                animation: ro-pre-spin 0.8s linear infinite;    
            }    
            #ro-preloader .pre-text {    
                font-family: serif;    
                font-size: 16px;    
                letter-spacing: 3px;    
                text-transform: uppercase;    
                color: #e8b84b;    
            }    
            #ro-preloader .pre-text span {    
                display: inline-block;    
                animation: ro-pre-wave 1.2s ease-in-out infinite;    
                animation-delay: calc(var(--i) * 0.08s);    
            }    
            @keyframes ro-pre-spin {    
                to { transform: rotate(360deg); }    
            }    
            @keyframes ro-pre-wave {    
                0%, 60%, 100% { transform: translateY(0); }    
                30% { transform: translateY(-8px); }    
            }    
            #ro-preloader.fade-out {    
                opacity: 0;    
                transition: opacity 0.3s ease;    
            }    
            .app-launcher {    
                display: flex;    
                flex-direction: column;    
                align-items: center;    
                justify-content: safe center;
                box-sizing: border-box;
                height: 100dvh;
                overflow: auto;
                padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(32px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
                background: rgba(6, 8, 16, 0.97);    
                font-family: serif;    
                color: #e8b84b;    
            }    
            .app-launcher h1 {    
                font-size: 28px;    
                letter-spacing: 3px;    
                text-transform: uppercase;    
                margin-bottom: 32px;    
            }    
            .button-grid {    
                display: flex;    
                flex-wrap: wrap;    
                gap: 16px;    
                justify-content: center;    
                max-width: 600px;    
            }    
            .app-btn {    
                padding: 14px 28px;    
                font-family: serif;    
                font-size: 16px;    
                letter-spacing: 2px;    
                color: #e8b84b;    
                background: transparent;    
                border: 2px solid rgba(232, 184, 75, 0.4);    
                border-radius: 8px;    
                cursor: pointer;    
                transition: all 0.3s ease;    
            }    
            .app-btn:hover {    
                background: rgba(232, 184, 75, 0.15);    
                border-color: #e8b84b;    
            }    
            @media (orientation: portrait) and (max-width: 600px) {
                .app-launcher {
                    justify-content: flex-start;
                    padding: max(24px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) max(44px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
                }
                .app-launcher h1 {
                    flex-shrink: 0;
                    margin: auto 0 20px;
                    font: 600 21px/1.3 system-ui, sans-serif;
                    letter-spacing: 0;
                    text-align: center;
                }
                .button-grid {
                    display: grid;
                    grid-template-columns: minmax(0, 1fr);
                    width: min(100%, 360px);
                    gap: 10px;
                    flex-shrink: 0;
                    margin-bottom: auto;
                }
                .app-btn {
                    width: 100%;
                    min-height: 46px;
                    padding: 10px 16px;
                    font: 600 15px/1.2 system-ui, sans-serif;
                    letter-spacing: 0;
                }
            }
            .build-id { position: fixed; right: max(16px, env(safe-area-inset-right)); bottom: max(12px, env(safe-area-inset-bottom)); color: #8b8f98; font: 12px monospace; }
        </style>    
    </head>    
    <body>    
        <div class="app-launcher">    
            <h1>roBrowser 应用启动器</h1>
            <div class="button-grid">    
                <button class="app-btn" onclick="launchApp('ONLINE')">进入游戏</button>
                <button class="app-btn" onclick="launchApp('GRANNYMODELVIEWER')">Granny 模型查看器</button>
                <button class="app-btn" onclick="launchApp('GRFVIEWER')">GRF 资源查看器</button>
                <button class="app-btn" onclick="launchApp('MAPVIEWER')">地图查看器</button>
                <button class="app-btn" onclick="launchApp('MODELVIEWER')">模型查看器</button>
                <button class="app-btn" onclick="launchApp('STRVIEWER')">STR 动画查看器</button>
                <button class="app-btn" onclick="launchApp('EFFECTVIEWER')">特效查看器</button>    
            </div>    
            <div class="build-id">Build: mueyap45</div>
        </div>    
  
        <script type="text/javascript">    
            function launchApp(appName) {    
                var url = 'api.html?v=mueyap45&app=' + appName + (new URLSearchParams(location.search).get('debug') === '1' ? '&debug=1' : '');
                // Keep touch devices and installed apps in their existing app window.
                if (window.matchMedia('(pointer: coarse), (display-mode: standalone), (display-mode: fullscreen)').matches) {
                    window.location.assign(url);
                    return;
                }
                var w = 1024, h = 768;
                var top = (screen.height - h) / 2;    
                var left = (screen.width - w) / 2;    
                window.open(    
                    url,
                    '_blank',    
                    'width=' + w + ',height=' + h + ',top=' + top + ',left=' + left + ',menubar=0,toolbar=0,location=0,status=0,resizable=1,scrollbars=0'    
                );    
            }    
        </script>    
    </body>    
</html>
