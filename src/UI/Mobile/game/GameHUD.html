<div class="hud">
	<div class="top-left">
		<button class="profile surface" data-panel="profile" aria-label="人物信息">
			<span class="profile-heading"><strong data-name></strong><span data-job></span></span>
			<label>HP <meter data-hp min="0" max="1"></meter><span data-hp-text></span></label>
			<label>SP <meter data-sp min="0" max="1"></meter><span data-sp-text></span></label>
		</button>
		<div class="profile-actions">
			<button class="surface menu-button" data-panel="menu">菜单</button>
			<button class="statuses surface" data-panel="status">
				<span data-status-icons></span>状态 <span data-status-count>0</span>
			</button>
		</div>
	</div>
	<div class="target surface"><span data-target>点击目标进行选择</span><button data-interact hidden></button></div>
	<div class="top-right">
		<button class="map surface" data-panel="map" aria-label="展开地图">
			<canvas width="128" height="128" data-mini-map></canvas><span data-map-name></span
			><small data-coordinates></small>
		</button>
	</div>
	<div class="joystick reserved" role="group" aria-label="移动摇杆"><span></span><small>移动</small></div>
	<!-- 聊天 UI 暂时隐藏，保留消息订阅与面板实现。 -->
	<button hidden class="chat-preview surface" data-panel="chat" aria-label="打开聊天">
		<span data-chat-preview>暂无消息</span><small>聊天 ›</small>
	</button>
	<div class="shortcut-tools surface">
		<button data-shortcut-page="-1" aria-label="上一组快捷槽">‹</button><span data-shortcut-page-label></span
		><button data-shortcut-page="1" aria-label="下一组快捷槽">›</button><button data-panel="shortcuts">配置</button>
	</div>
	<div class="skill-prompt surface" hidden>
		<span data-skill-prompt></span><button data-skill-self hidden>对自己施放</button
		><button data-skill-cancel>取消施法</button>
	</div>
	<div class="combat reserved" aria-label="战斗按钮">
		<button class="skill skill-one" data-shortcut="0" aria-label="技能槽位 1">＋</button
		><button class="skill skill-two" data-shortcut="1" aria-label="技能槽位 2">＋</button
		><button class="skill skill-three" data-shortcut="2" aria-label="技能槽位 3">＋</button>
		<button class="attack">攻击</button>
	</div>
	<div class="backdrop" hidden>
		<section class="panel surface" role="dialog" aria-modal="true" aria-labelledby="mobile-game-panel-title">
			<header>
				<h2 id="mobile-game-panel-title" tabindex="-1"></h2>
				<button data-close aria-label="关闭面板">关闭</button>
			</header>
			<div class="panel-body"></div>
		</section>
	</div>
</div>
